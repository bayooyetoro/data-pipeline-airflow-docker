[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api_etl"
version = "0.1.0"
description = "ETL pipeline for API extraction and SQLite loading"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.scripts]
run-pipeline = "api_etl.__main__:main"